<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keshvi Gandhi — Fashion Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15120F;
    --ink-soft:#221D17;
    --ink-soft2:#2C251D;
    --paper:#EDE3CE;
    --paper-dim:#E1D5B9;
    --gold:#B4915C;
    --gold-bright:#D4B27E;
    --crimson:#8B2E2E;
    --maroon:#3D1B24;
    --ink-text:#EDE3CE;
    --ink-text-dim:#B9AE98;
    --paper-text:#221A12;
    --paper-text-dim:#5A4E3C;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--ink-text);
    font-family:'Work Sans',sans-serif;
    font-weight:300;
    overflow-x:hidden;
    padding-left:34px;
  }
  ::selection{background:var(--gold);color:var(--ink);}

  h1,h2,h3,.display{font-family:'Playfair Display',serif;}
  .mono{font-family:'Space Mono',monospace;}

  /* ---------- tape measure scroll indicator ---------- */
  #tape{
    position:fixed;top:0;left:0;bottom:0;width:34px;
    background:linear-gradient(180deg,#1A1611,#0F0D0A);
    border-right:1px solid rgba(180,145,92,0.25);
    z-index:500;
    overflow:hidden;
  }
  #tape-fill{
    position:absolute;top:0;left:0;width:100%;height:0%;
    background:linear-gradient(180deg,rgba(180,145,92,0.16),rgba(180,145,92,0.05));
    transition:height 0.05s linear;
    border-bottom:1px solid rgba(212,178,126,0.5);
  }
  .tape-ticks{position:absolute;top:0;left:0;width:100%;height:100%;}
  .tick{
    position:absolute;left:0;width:100%;
    display:flex;align-items:center;
  }
  .tick .line{width:10px;height:1px;background:rgba(212,178,126,0.55);margin-left:2px;}
  .tick.major .line{width:18px;background:rgba(212,178,126,0.85);}
  .tick .num{
    font-family:'Space Mono',monospace;font-size:8px;color:rgba(212,178,126,0.6);
    margin-left:4px;letter-spacing:0.5px;
  }
  #tape-pin{
    position:absolute;left:50%;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#F0D9A8,#B4915C 70%,#7A5E38);
    box-shadow:0 0 8px rgba(212,178,126,0.6);
    transform:translate(-50%,-50%);
    top:0;transition:top 0.05s linear;
    z-index:2;
  }

  section{position:relative;padding:0 6vw;}
  .max{max-width:1160px;margin:0 auto;}

  /* ---------- hero ---------- */
  #hero{
    min-height:100vh;display:flex;align-items:center;
    padding-top:80px;padding-bottom:60px;
    background:
      radial-gradient(ellipse at 75% 20%, rgba(139,46,46,0.18), transparent 55%),
      radial-gradient(ellipse at 15% 85%, rgba(180,145,92,0.12), transparent 50%),
      var(--ink);
  }
  .hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:60px;align-items:center;width:100%;}
  .kicker{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;
    color:var(--gold-bright);text-transform:uppercase;margin-bottom:28px;
    display:flex;align-items:center;gap:12px;
  }
  .kicker::before{content:'';display:inline-block;width:28px;height:1px;background:var(--gold);}
  .hero-name{
    font-size:clamp(52px,8vw,104px);line-height:0.96;font-weight:700;
    letter-spacing:0.5px;
  }
  .hero-name .last{display:block;color:var(--gold-bright);font-style:italic;font-weight:600;}
  .hero-role{
    margin-top:26px;font-family:'Space Mono',monospace;font-size:13px;
    letter-spacing:4px;text-transform:uppercase;color:var(--ink-text-dim);
    padding-bottom:18px;border-bottom:1px solid rgba(180,145,92,0.3);
    display:inline-block;
  }
  .hero-quote{
    margin-top:34px;font-family:'Playfair Display',serif;font-style:italic;
    font-size:20px;line-height:1.55;color:var(--ink-text);max-width:520px;
    font-weight:500;
  }
  .hero-quote span{color:var(--gold-bright);font-style:normal;}
  .hero-loc{margin-top:28px;font-size:13px;color:var(--ink-text-dim);letter-spacing:0.5px;}
  .hero-loc b{color:var(--gold-bright);font-weight:500;}

  .hero-photo-wrap{position:relative;display:flex;justify-content:center;}
  .polaroid{
    background:var(--paper);padding:14px 14px 54px 14px;
    transform:rotate(3deg);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.05);
    max-width:340px;position:relative;
  }
  .polaroid img{width:100%;display:block;filter:saturate(1.05) contrast(1.02);}
  .polaroid .cap{
    position:absolute;bottom:14px;left:14px;right:14px;
    font-family:'Space Mono',monospace;font-size:10.5px;color:var(--paper-text-dim);
    letter-spacing:0.5px;text-align:center;
  }
  .pin{
    position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#E8A0A0,var(--crimson) 70%,#5c1c1c);
    box-shadow:0 3px 6px rgba(0,0,0,0.4);z-index:3;
  }

  /* ---------- section headers ---------- */
  .sec-head{display:flex;align-items:baseline;gap:18px;margin-bottom:10px;}
  .sec-num{font-family:'Space Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:2px;}
  .sec-title{font-size:clamp(30px,4vw,46px);font-weight:700;}
  .sec-sub{
    font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:2px;
    text-transform:uppercase;color:var(--ink-text-dim);margin-top:14px;margin-bottom:50px;
    max-width:620px;line-height:1.8;font-weight:400;
  }
  .stitch{
    height:1px;width:100%;margin:0 0 50px 0;
    background-image:repeating-linear-gradient(90deg,var(--gold) 0 8px, transparent 8px 16px);
    opacity:0.4;
  }

  /* ---------- about ---------- */
  #about{padding-top:130px;padding-bottom:110px;}
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;}
  .about-text p{font-size:16.5px;line-height:1.85;color:var(--ink-text-dim);font-weight:300;}
  .about-text p+p{margin-top:18px;}
  .pillars{display:flex;flex-direction:column;gap:0;}
  .pillar{padding:26px 0;border-top:1px solid rgba(180,145,92,0.25);}
  .pillar:last-child{border-bottom:1px solid rgba(180,145,92,0.25);}
  .pillar h4{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2.5px;
    color:var(--gold-bright);margin-bottom:10px;
  }
  .pillar p{font-size:15px;color:var(--ink-text-dim);line-height:1.6;font-weight:300;}

  /* ---------- work sections ---------- */
  .work-block{padding-top:90px;padding-bottom:30px;}
  .work-block:nth-of-type(odd){background:var(--ink-soft);}

  .look{
    display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:80px;
    align-items:stretch;
  }
  .look.rev .look-img{order:2;}
  .look.rev .look-card{order:1;}
  .look-img{position:relative;overflow:hidden;min-height:340px;}
  .look-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.6s ease;}
  .look-img:hover img{transform:scale(1.045);}
  .look-tag{
    position:absolute;top:16px;left:16px;background:rgba(20,17,13,0.82);
    color:var(--gold-bright);font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:1.5px;padding:6px 10px;text-transform:uppercase;
    border:1px solid rgba(212,178,126,0.4);
  }
  .look-card{
    background:var(--paper);color:var(--paper-text);
    padding:44px 42px;display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .pinked-top, .pinked-bottom{position:absolute;left:0;width:100%;height:11px;}
  .pinked-top{top:-1px;}
  .pinked-bottom{bottom:-1px;transform:scaleY(-1);}
  .look-num{
    font-family:'Space Mono',monospace;font-size:12px;color:var(--crimson);
    letter-spacing:2px;margin-bottom:14px;
  }
  .look-title{font-size:25px;font-weight:700;line-height:1.25;margin-bottom:6px;}
  .look-role{
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:1.2px;
    color:var(--paper-text-dim);text-transform:uppercase;margin-bottom:18px;
  }
  .look-desc{font-size:14.5px;line-height:1.75;color:var(--paper-text-dim);font-weight:400;}
  .look-desc+.look-desc{margin-top:10px;}

  .link-btn-group {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .social-link-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 18px;
    text-decoration: none;
    border: 1px solid var(--crimson);
    color: var(--crimson);
    background: transparent;
    transition: all 0.25s ease;
    display: inline-block;
  }
  .social-link-btn:hover {
    background: var(--crimson);
    color: var(--paper);
  }

  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;}
  .grid3 .look-img{min-height:260px;}

  /* ---------- experience ---------- */
  #experience{padding-top:110px;padding-bottom:100px;}
  .timeline{border-top:1px solid rgba(180,145,92,0.3);}
  .trow{
    display:grid;grid-template-columns:110px 1fr 1.7fr;gap:30px;
    padding:26px 0;border-bottom:1px solid rgba(180,145,92,0.18);
  }
  .trow .yr{font-family:'Space Mono',monospace;color:var(--gold-bright);font-size:14px;padding-top:2px;}
  .trow .role{font-size:17px;font-weight:600;color:var(--ink-text);}
  .trow .org{font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:1px;margin-top:5px;text-transform:uppercase;}
  .trow .desc{font-size:14.5px;color:var(--ink-text-dim);line-height:1.7;font-weight:300;}

  /* ---------- skills / education / recognition ---------- */
  #skills{padding-top:100px;padding-bottom:110px;}
  .skl-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:70px;}
  .swatch-group{margin-bottom:34px;}
  .swatch-group h4{
    font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:2.5px;
    color:var(--gold-bright);text-transform:uppercase;margin-bottom:16px;
  }
  .swatches{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{
    padding:9px 16px;border:1px solid rgba(180,145,92,0.4);
    font-size:13px;color:var(--ink-text);font-weight:400;
    position:relative;background:rgba(180,145,92,0.05);
  }
  .side-col .box{margin-bottom:40px;}
  .side-col h4{
    font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:2.5px;
    color:var(--gold-bright);text-transform:uppercase;margin-bottom:18px;
    border-bottom:1px solid rgba(180,145,92,0.3);padding-bottom:12px;
  }
  .edu-item{margin-bottom:16px;}
  .edu-item .deg{font-size:14.5px;color:var(--ink-text);font-weight:500;}
  .edu-item .sch{font-size:12.5px;color:var(--ink-text-dim);margin-top:3px;font-family:'Space Mono',monospace;}
  .rec-list{display:flex;flex-direction:column;gap:10px;}
  .rec-item{font-size:13.5px;color:var(--ink-text-dim);display:flex;justify-content:space-between;gap:10px;}
  .rec-item b{color:var(--ink-text);font-weight:500;}

  /* ---------- contact / closing ---------- */
  #contact{
    padding-top:120px;padding-bottom:100px;text-align:center;
    background:radial-gradient(ellipse at 50% 0%, rgba(139,46,46,0.15), transparent 60%), var(--ink-soft2);
  }
  .contact-quote{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
    font-size:clamp(24px,3.4vw,38px);line-height:1.4;max-width:780px;margin:0 auto 20px auto;
  }
  .contact-attr{font-family:'Space Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:1.5px;margin-bottom:60px;}
  .cta-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:20px;}
  .btn{
    font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:1.5px;
    text-transform:uppercase;padding:16px 32px;text-decoration:none;
    border:1px solid var(--gold);color:var(--ink-text);transition:all 0.25s ease;
    display:inline-block;
  }
  .btn.solid{background:var(--gold);color:var(--ink);}
  .btn:hover{background:var(--gold);color:var(--ink);}
  .contact-foot{margin-top:70px;font-size:12px;color:var(--ink-text-dim);letter-spacing:0.5px;}

  footer{
    padding:30px 6vw 30px calc(6vw + 34px);text-align:center;
    font-family:'Space Mono',monospace;font-size:10.5px;color:var(--ink-text-dim);
    letter-spacing:1px;background:var(--ink);
  }

  [data-reveal]{opacity:0;transform:translateY(28px);transition:opacity 0.7s ease, transform 0.7s ease;}
  [data-reveal].in{opacity:1;transform:translateY(0);}

  @media (max-width:860px){
    body{padding-left:0;}
    #tape{display:none;}
    .hero-grid{grid-template-columns:1fr;gap:40px;}
    .hero-photo-wrap{order:-1;}
    .about-grid{grid-template-columns:1fr;gap:40px;}
    .look, .look.rev{grid-template-columns:1fr;}
    .look.rev .look-img, .look.rev .look-card{order:0;}
    .grid3{grid-template-columns:1fr;}
    .skl-grid{grid-template-columns:1fr;}
    .trow{grid-template-columns:1fr;gap:8px;}
    section{padding:0 6vw;}
  }
</style>
</head>
<body>

<div id="tape">
  <div id="tape-fill"></div>
  <div class="tape-ticks" id="ticks"></div>
  <div id="tape-pin"></div>
</div>
